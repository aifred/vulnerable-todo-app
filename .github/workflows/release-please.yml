name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-artifacts:
    name: Build and attach release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jar
        run: mvn -B clean package -DskipTests

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Package frontend artifact
        run: |
          cd frontend/dist/frontend
          zip -r "${{ github.workspace }}/frontend-${{ needs.release-please.outputs.tag_name }}.zip" .

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BACKEND_JAR=$(ls target/*.jar | grep -v original | head -n1)
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$BACKEND_JAR#backend-${{ needs.release-please.outputs.tag_name }}.jar" \
            "frontend-${{ needs.release-please.outputs.tag_name }}.zip"
