name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=aifred_vulnerable-todo-app

  release:
    name: Release backend and frontend
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: version
        run: |
          CURRENT_VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set release version in pom.xml
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.release_version }} -DgenerateBackupPoms=false

      - name: Build backend jar
        run: mvn -B clean package -DskipTests

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Package frontend release
        run: |
          cd frontend/dist/frontend
          zip -r ../../../frontend-${{ steps.version.outputs.release_version }}.zip .

      - name: Commit release version
        run: |
          git add pom.xml
          git commit -m "chore(release): ${{ steps.version.outputs.release_version }}"
          git tag ${{ steps.version.outputs.tag }}

      - name: Prepare next development version
        run: |
          mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.next_version }} -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: prepare for next development iteration"

      - name: Push commits and tag
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "target/vulnerable-todo-app-${{ steps.version.outputs.release_version }}.jar#backend-${{ steps.version.outputs.release_version }}.jar" \
            "frontend-${{ steps.version.outputs.release_version }}.zip#frontend-${{ steps.version.outputs.release_version }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
